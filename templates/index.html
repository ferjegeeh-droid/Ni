<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Topaz Mobile AI</title>
    <style>
        :root { --bg: #000; --card: #121212; --blue: #007aff; --green: #34c759; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto; background: var(--bg); color: white; }
        
        .app-container { display: flex; flex-direction: column; height: 100vh; }
        
        /* منطقة العرض */
        .viewer { flex: 1; position: relative; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        video { width: 100%; max-height: 40vh; background: #111; margin-bottom: 5px; border-radius: 8px; }
        .label-tag { background: rgba(0,0,0,0.6); padding: 2px 8px; font-size: 12px; border-radius: 4px; align-self: flex-start; margin: 5px 15px; color: #aaa; }

        /* منطقة الإعدادات */
        .controls { background: var(--card); padding: 20px; border-top: 1px solid #222; border-radius: 20px 20px 0 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        
        label { font-size: 11px; color: #888; display: block; margin-bottom: 4px; }
        select, input { width: 100%; background: #1c1c1e; border: none; color: white; padding: 12px; border-radius: 10px; font-size: 14px; outline: none; }

        .btn-main { background: var(--blue); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: bold; width: 100%; font-size: 16px; margin-top: 10px; transition: 0.2s; }
        .btn-main:active { transform: scale(0.98); opacity: 0.8; }
        .btn-download { background: var(--green); display: none; text-decoration: none; text-align: center; }

        /* تحميل */
        .loader { display: none; position: absolute; background: rgba(0,0,0,0.8); top:0; left:0; right:0; bottom:0; z-index: 10; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid #333; border-top-color: var(--blue); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="app-container">
    <div class="viewer">
        <!-- المقارنة: أصلي -->
        <span class="label-tag">الأصلي (Original)</span>
        <video id="originalVideo" playsinline muted loop></video>
        
        <!-- المقارنة: بعد التعديل -->
        <span class="label-tag">النتيجة (Enhanced)</span>
        <video id="enhancedVideo" playsinline controls loop></video>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p>جاري المعالجة... (قد يستغرق 2-5 دقائق)</p>
        </div>
    </div>

    <div class="controls">
        <div class="grid">
            <div>
                <label>التكبير</label>
                <select id="scale">
                    <option value="2">2x HD</option>
                    <option value="4">4x 4K</option>
                </select>
            </div>
            <div>
                <label>تحسين الوجه</label>
                <select id="face_enhance">
                    <option value="false">إيقاف</option>
                    <option value="true">تفعيل</option>
                </select>
            </div>
        </div>

        <input type="file" id="videoInput" accept="video/*" style="display:none">
        <button class="btn-main" id="selectBtn" onclick="document.getElementById('videoInput').click()">1. اختر الفيديو</button>
        <button class="btn-main" id="runBtn" onclick="process()">2. ابدأ المعالجة والتصدير</button>
        
        <a id="downloadBtn" class="btn-main btn-download">3. حفظ في الاستوديو</a>
    </div>
</div>

<script>
    const videoInput = document.getElementById('videoInput');
    const originalVideo = document.getElementById('originalVideo');
    const enhancedVideo = document.getElementById('enhancedVideo');
    const downloadBtn = document.getElementById('downloadBtn');
    const loader = document.getElementById('loader');

    videoInput.onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
            const url = URL.createObjectURL(file);
            originalVideo.src = url;
            originalVideo.play();
            document.getElementById('selectBtn').innerText = "تم اختيار: " + file.name.substring(0,10) + "...";
        }
    };

    async function process() {
        if (!videoInput.files[0]) return alert("اختر فيديو أولاً");

        loader.style.display = 'flex';
        const formData = new FormData();
        formData.append('file', videoInput.files[0]);
        formData.append('scale', document.getElementById('scale').value);
        formData.append('face_enhance', document.getElementById('face_enhance').value);
        formData.append('fps', "24");

        try {
            const response = await fetch('/enhance-video', { method: 'POST', body: formData });
            const data = await response.json();

            if (data.video_url) {
                enhancedVideo.src = data.video_url;
                downloadBtn.href = data.video_url;
                downloadBtn.style.display = 'block';
                downloadBtn.download = "topaz_enhanced.mp4"; // للكمبيوتر
                alert("تمت المعالجة! يمكنك الآن مشاهدة الفرق وحفظ الفيديو.");
            } else {
                alert("خطأ: " + data.error);
            }
        } catch (e) {
            alert("حدث خطأ في الاتصال بالسيرفر");
        } finally {
            loader.style.display = 'none';
        }
    }
</script>

</body>
</html>
