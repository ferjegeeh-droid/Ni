<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Topaz AI Video Web</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; color: white; display: flex; height: 100vh; margin: 0; }
        /* القائمة الجانبية للإعدادات */
        .sidebar { width: 300px; background: #151515; padding: 20px; border-left: 1px solid #333; }
        .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .setting-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #aaa; }
        select, input { width: 100%; background: #222; border: 1px solid #444; color: white; padding: 8px; border-radius: 5px; }
        .preview-box { width: 80%; height: 60%; border: 2px dashed #333; border-radius: 10px; display: flex; align-items: center; justify-content: center; position: relative; }
        .btn-primary { background: #005ce6; color: white; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        #status { margin-top: 15px; color: #00ff00; display: none; }
        video { max-width: 100%; max-height: 100%; border-radius: 8px; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>إعدادات المعالجة</h2>
    
    <div class="setting-group">
        <label>درجة التكبير (Upscale)</label>
        <select id="scale">
            <option value="2">2x (HD)</option>
            <option value="4">4x (4K)</option>
        </select>
    </div>

    <div class="setting-group">
        <label>تحسين ملامح الوجه</label>
        <select id="face_enhance">
            <option value="false">إيقاف</option>
            <option value="true">تفعيل (AI Face)</option>
        </select>
    </div>

    <div class="setting-group">
        <label>معدل الفريمات (FPS)</label>
        <input type="number" id="fps" value="24">
    </div>

    <button class="btn-primary" onclick="processVideo()">ابدأ المعالجة</button>
    <div id="status">جاري معالجة الفيديو... قد يستغرق دقائق</div>
</div>

<div class="main-content">
    <h1>Topaz AI Video Clone</h1>
    <div class="preview-box" id="previewContainer">
        <input type="file" id="videoInput" accept="video/*" onchange="previewUpload()">
        <p id="uploadText">اسحب الفيديو هنا أو انقر للاختيار</p>
    </div>
    <div id="resultArea" style="margin-top: 20px; width: 100%; text-align: center;"></div>
</div>

<script>
    function previewUpload() {
        const file = document.getElementById('videoInput').files[0];
        document.getElementById('uploadText').innerText = "تم اختيار: " + file.name;
    }

    async function processVideo() {
        const fileInput = document.getElementById('videoInput');
        if (fileInput.files.length === 0) return alert("اختر فيديو أولاً");

        const status = document.getElementById('status');
        const resultArea = document.getElementById('resultArea');
        status.style.display = 'block';

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        formData.append('scale', document.getElementById('scale').value);
        formData.append('face_enhance', document.getElementById('face_enhance').value);
        formData.append('fps', document.getElementById('fps').value);

        try {
            const response = await fetch('/enhance-video', { method: 'POST', body: formData });
            const data = await response.json();

            if (data.video_url) {
                resultArea.innerHTML = `
                    <h3>النتيجة النهائية:</h3>
                    <video controls src="${data.video_url}"></video>
                    <br><br>
                    <a href="${data.video_url}" download style="color:#005ce6">تحميل الفيديو المحسن</a>
                `;
            } else {
                alert("خطأ: " + data.error);
            }
        } catch (e) {
            alert("حدث خطأ في الاتصال");
        } finally {
            status.style.display = 'none';
        }
    }
</script>

</body>
</html>
