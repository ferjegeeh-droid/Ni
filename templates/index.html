<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>AI Image Enhancer (Topaz Clone)</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #121212; color: white; }
        .upload-box { border: 2px dashed #444; padding: 40px; border-radius: 10px; margin-bottom: 20px; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        #loading { display: none; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>مُحسن الصور بالذكاء الاصطناعي</h1>
    <div class="upload-box">
        <input type="file" id="imageInput" accept="image/*">
        <br><br>
        <button onclick="uploadImage()">ابدأ التحسين (Scale x4)</button>
    </div>
    <div id="loading">جاري المعالجة... قد يستغرق الأمر دقيقة لأننا نستخدم CPU مجاني...</div>
    <div id="result"></div>

    <script>
        async function uploadImage() {
            const input = document.getElementById('imageInput');
            if (input.files.length === 0) return alert("اختر صورة أولاً");

            document.getElementById('loading').style.display = 'block';
            const formData = new FormData();
            formData.append('file', input.files[0]);

            const response = await fetch('/enhance', { method: 'POST', body: formData });
            const blob = await response.blob();
            
            const url = URL.createObjectURL(blob);
            document.getElementById('result').innerHTML = `
                <h3>النتيجة:</h3>
                <img src="${url}" style="max-width: 100%; border-radius: 10px;">
                <br><br>
                <a href="${url}" download="enhanced.png">تحميل الصورة المحسنة</a>
            `;
            document.getElementById('loading').style.display = 'none';
        }
    </script>
</body>
</html>
