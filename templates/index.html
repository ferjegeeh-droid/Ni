<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Topaz AI Video</title>
    <style>
        :root { --bg: #000; --card: #121212; --blue: #007aff; --green: #34c759; }
        body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: white; overflow-x: hidden; }
        
        .app-header { padding: 15px; text-align: center; border-bottom: 1px solid #222; font-weight: bold; font-size: 1.2rem; }
        
        .viewer { padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .video-box { background: #111; border-radius: 12px; overflow: hidden; border: 1px solid #333; position: relative; }
        video { width: 100%; display: block; background: #000; max-height: 250px; }
        .tag { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 4px; font-size: 10px; z-index: 2; }

        .controls { background: var(--card); padding: 20px; border-radius: 20px 20px 0 0; margin-top: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        
        label { font-size: 12px; color: #888; margin-bottom: 5px; display: block; }
        select { width: 100%; background: #1c1c1e; border: 1px solid #333; color: white; padding: 12px; border-radius: 10px; font-size: 14px; }

        .btn { width: 100%; padding: 16px; border-radius: 12px; font-weight: bold; font-size: 16px; border: none; margin-bottom: 10px; cursor: pointer; transition: 0.2s; }
        .btn-blue { background: var(--blue); color: white; }
        .btn-green { background: var(--green); color: white; display: none; text-decoration: none; text-align: center; }
        
        .loader { display: none; text-align: center; padding: 20px; }
        .spinner { width: 30px; height: 30px; border: 3px solid #333; border-top-color: var(--blue); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="app-header">TOPAZ AI VIDEO CLOUD</div>

<div class="viewer">
    <div class="video-box">
        <span class="tag">الفيديو الأصلي</span>
        <video id="originalVideo" muted playsinline></video>
    </div>
    
    <div class="video-box">
        <span class="tag" style="color: var(--green);">النتيجة بعد التحسين</span>
        <video id="enhancedVideo" controls playsinline></video>
    </div>
</div>

<div id="loader" class="loader">
    <div class="spinner"></div>
    <p style="font-size: 14px; color: #888;">جاري المعالجة الذكية... انتظر 2-5 دقائق</p>
</div>

<div class="controls">
    <div class="grid">
        <div>
            <label>الدقة المطلوبة</label>
            <select id="scale">
                <option value="2">2x (HD)</option>
                <option value="4">4x (4K)</option>
            </select>
        </div>
        <div>
            <label>تحسين الوجوه</label>
            <select id="face_enhance">
                <option value="false">إيقاف</option>
                <option value="true">تفعيل</option>
            </select>
        </div>
    </div>

    <input type="file" id="videoInput" accept="video/*" style="display:none">
    <button class="btn btn-blue" onclick="document.getElementById('videoInput').click()">1. اختيار الفيديو من الاستوديو</button>
    <button class="btn btn-blue" style="background:#333" onclick="process()">2. ابدأ المعالجة الآن</button>
    
    <a id="downloadBtn" class="btn btn-green" target="_blank">3. حفظ المقطع المحسن</a>
</div>

<script>
    const videoInput = document.getElementById('videoInput');
    const originalVideo = document.getElementById('originalVideo');
    const enhancedVideo = document.getElementById('enhancedVideo');
    const downloadBtn = document.getElementById('downloadBtn');
    const loader = document.getElementById('loader');

    videoInput.onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
            originalVideo.src = URL.createObjectURL(file);
            originalVideo.play();
        }
    };

    async function process() {
        if (!videoInput.files[0]) return alert("الرجاء اختيار فيديو!");

        loader.style.display = 'block';
        const formData = new FormData();
        formData.append('file', videoInput.files[0]);
        formData.append('scale', document.getElementById('scale').value);
        formData.append('face_enhance', document.getElementById('face_enhance').value);
        formData.append('fps', "24");

        try {
            const response = await fetch('/enhance-video', { method: 'POST', body: formData });
            const data = await response.json();

            if (data.video_url) {
                enhancedVideo.src = data.video_url;
                enhancedVideo.play();
                downloadBtn.href = data.video_url;
                downloadBtn.style.display = 'block';
                alert("تم التحسين بنجاح!");
            } else {
                alert("خطأ: " + data.error);
            }
        } catch (e) {
            alert("فشل الاتصال بالسيرفر");
        } finally {
            loader.style.display = 'none';
        }
    }
</script>

</body>
</html>
